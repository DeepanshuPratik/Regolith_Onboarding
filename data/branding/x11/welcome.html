<!doctype html>
<meta charset="utf-8">
<style>html,body{background:#1a1a1a;color:#e6e6e6}</style>
<link rel="stylesheet" href="app:///palette.css">
<link rel="stylesheet" href="slides/assets/style.css">
<div class="welcome">
  <!-- X11 has no marketing mark. The closest honest visual is the X itself,
       rendered as a glyph: two crossing strokes at an angle, with the gap
       between them the page background. The point is the simplicity. -->
  <svg class="logo" viewBox="0 0 96 96" role="img" aria-label="X">
    <g stroke="var(--fg)" stroke-width="14" stroke-linecap="square">
      <line x1="18" y1="18" x2="78" y2="78"/>
      <line x1="78" y1="18" x2="18" y2="78"/>
    </g>
  </svg>
  <h1>Welcome to X11</h1>
  <p class="lede">
    You're seeing the fallback deck — the one shown when the desktop in use
    isn't a known one. X11 isn't a desktop, it's a protocol. The shortcuts
    that follow are the ones every window manager respects.
  </p>
  <a class="cta" href="app://action/next">Get Started</a>
</div>
