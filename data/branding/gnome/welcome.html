<!doctype html>
<meta charset="utf-8">
<!-- Inline background matches Branding/Background in branding.conf so the
     first frame is the same colour as the rest of the deck. -->
<style>html,body{background:#fafafa;color:#2e3436}</style>
<link rel="stylesheet" href="app:///palette.css">
<link rel="stylesheet" href="slides/assets/style.css">
<div class="welcome">
  <!-- Ubuntu-inspired "circle of three" mark. Inline so it inherits --brand-orange
       from the deck stylesheet and recolours with the brand. -->
  <svg class="logo" viewBox="0 0 96 96" role="img" aria-label="Ubuntu-style mark">
    <defs>
      <!-- Two halos so each friend reads as a separate shape, not a single blob. -->
      <mask id="ubuntu-friends">
        <rect width="96" height="96" fill="white"/>
        <circle cx="48" cy="48" r="38" fill="black"/>
        <!-- Top friend (head + arm cutout). -->
        <circle cx="48" cy="22" r="9"/>
        <path d="M30 60 Q30 38 48 38 Q66 38 66 60 L66 64 L30 64 Z" fill="black"/>
        <!-- Right friend leaning in. -->
        <circle cx="76" cy="40" r="8" transform="rotate(45 76 40)"/>
        <path d="M58 70 Q66 50 84 56 L84 70 Z" fill="black"/>
        <!-- Left friend leaning in. -->
        <circle cx="20" cy="40" r="8" transform="rotate(-45 20 40)"/>
        <path d="M12 70 L12 56 Q30 50 38 70 Z" fill="black"/>
      </mask>
    </defs>
    <!-- The big orange disc, with the three friends cut out so the page bg shows
         through as their silhouettes. -->
    <circle cx="48" cy="48" r="40" fill="var(--brand-orange)" mask="url(#ubuntu-friends)"/>
    <!-- The ring underneath the friends gives the mark its outer edge. -->
    <circle cx="48" cy="48" r="40" fill="none" stroke="var(--brand-orange)" stroke-width="3"/>
  </svg>
  <h1>Welcome to Ubuntu</h1>
  <p class="lede">
    A clean GNOME desktop that does what you mean. This short tour shows the
    gestures and shortcuts that make it disappear into the background.
  </p>
  <a class="cta" href="app://action/next">Get Started</a>
</div>
