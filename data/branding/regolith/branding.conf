# Branding for Regolith Linux.
#
# A distro owner copies this directory, edits this file, replaces the logo,
# theme and slides, and builds with:
#
#     meson setup build -Dbranding_dir=/path/to/their-branding
#
# Everything here is compiled into the binary.

[Branding]
# Used outside the HTML deck: the startup log and --check-workflows. The
# name, tagline and logo the user actually reads are in welcome.html.
Name=Regolith
Theme=theme.css

# This branding's version, dotted-numeric ("1", "1.0", "3.10.2" — nothing else).
# It is not the application's version: bump it when you change what is in this
# directory, and leave it alone for an app bugfix release, or every user is shown
# the deck again for a change they cannot see.
Version=1.0

# The first page. Optional, defaults to welcome.html; set it empty to open on
# the slides instead.
Welcome=welcome.html

# Optional. Omit to show every .html in slides/ in filename order.
SlideOrder=01-tiling.html;02-workspaces.html;03-practice.html;

# Optional, default false. Slides are authored content, so scripting is off
# unless a distro deliberately turns it on.
AllowSlideScripts=false

[Slides]
# Since= per slide: the branding Version the slide first appeared in. On an
# upgrade a slide is shown again only when its Since is above the version the
# user last saw, so a returning user gets the new material and not the old.
#
# Omitting a slide here means it has always been there: it is part of a first
# run, which shows everything, and never part of an upgrade delta.
01-tiling.html=1.0
02-workspaces.html=1.0
03-practice.html=1.0

[Marketplace]
Name=Regolith Workflow Marketplace
Url=https://github.com/regolith-linux/onboarding-marketplace
