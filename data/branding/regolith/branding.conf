# Branding for Regolith Linux.
#
# A distro owner copies this directory, edits this file, replaces the logo,
# theme and slides, and builds with:
#
#     meson setup build -Dbranding_dir=/path/to/their-branding
#
# Everything here is compiled into the binary.

[Branding]
Name=Regolith
Tagline=A tiling desktop that keeps your hands on the keyboard. This guide covers the shortcuts worth knowing first.
Logo=logo.png
Theme=theme.css

# Optional. Omit to show every .html in slides/ in filename order.
SlideOrder=01-welcome.html;02-tiling.html;03-practice.html;

# Optional, default false. Slides are authored content, so scripting is off
# unless a distro deliberately turns it on.
AllowSlideScripts=false

[Marketplace]
Name=Regolith Workflow Marketplace
Url=https://github.com/regolith-linux/onboarding-marketplace
